<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 920px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: start;
        }

        h1 {
            grid-column: 1 / -1;
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title {
            color: #555;
            margin: 0 0 1rem 0;
            font-size: 1.1rem;
            text-align: center;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .product-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 14px 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: #333;
            min-height: 70px;
            user-select: none;
        }

        .product-name {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 4px;
        }

        .product-price {
            font-size: 0.85rem;
            color: #764ba2;
            font-weight: 600;
        }

        .product-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.25);
            background: linear-gradient(135deg, #e8eaf6 0%, #c5cae9 100%);
        }

        .product-card:active {
            transform: translateY(-1px);
        }

        .cart-section {
            display: flex;
            flex-direction: column;
            height: 100%;
            border-left: 2px solid #e8e8e8;
            padding-left: 2rem;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 10px;
            background: linear-gradient(135deg, #f5f7fa 0%, #ece9f1 100%);
            border: 1px solid #e0dce5;
            border-radius: 10px;
            padding: 12px;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .cart-item-price {
            font-size: 0.9rem;
            color: #764ba2;
            margin-right: 5px;
            font-weight: 600;
        }

        .cart-item-name {
            font-weight: 600;
            color: #333;
        }

        .cart-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 6px;
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.9rem;
            line-height: 1;
            color: #fff;
            font-weight: 700;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn:hover {
            transform: scale(1.15);
            box-shadow: 0 3px 10px rgba(102, 126, 234, 0.4);
        }

        .total {
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.3rem;
            color: #1a1a2e;
            text-align: right;
            padding-top: 12px;
            border-top: 2px solid #667eea;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #1a1a2e;
            text-align: center;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.35);
            font-family: inherit;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(67, 233, 123, 0.5);
        }

        .buy-btn:active {
            transform: translateY(0);
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .cart-section {
                border-left: none;
                border-top: 2px solid #e8e8e8;
                padding-left: 0;
                padding-top: 2rem;
                margin-top: 1rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Fruit Shopping Cart</h1>

        <div class="products-section">
            <h2 class="section-title">Products</h2>
            <div class="product-grid" id="product-grid">
                <!-- Products will be generated by JS -->
            </div>
        </div>

        <div class="cart-section">
            <h2 class="section-title">Cart Items</h2>
            <div class="cart-items" id="cart-items">
                <!-- Cart items will be generated by JS -->
            </div>

            <div class="total" id="total-price">
                Total: ₹0
            </div>
            <button class="buy-btn" onclick="buy()">Buy Now</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
