<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voting System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        form {
            width: 100%;
            max-width: 520px;
        }

        #maincont {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            width: 100%;
        }

        #maincont>label:first-child {
            display: block;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #667eea;
        }

        label {
            display: block;
            font-weight: 600;
            margin-top: 14px;
            margin-bottom: 6px;
            color: #444;
            font-size: 14px;
        }

        input[type="text"],
        input[type="date"],
        input[type="email"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            margin-bottom: 6px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            background: #fafafa;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
            background: #fff;
        }

        button {
            padding: 10px 22px;
            border: none;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            margin-top: 16px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.35);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        #submitBtn {
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #1a1a2e;
            box-shadow: 0 4px 15px rgba(67, 233, 123, 0.35);
        }

        #submitBtn:hover {
            box-shadow: 0 6px 20px rgba(67, 233, 123, 0.5);
        }

        #continueBtn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.35);
        }

        #continueBtn:hover {
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }

        #voteSection,
        #moreDetails {
            margin-top: 16px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .small {
            font-size: 12px;
            color: #888;
        }

        ::placeholder {
            color: #bbb;
        }
    </style>
</head>

<body>
    <form>
        <div id="maincont">
            <label>Voting System</label>

            <label>Enter your Name:</label>
            <input type="text" id="name" placeholder="Enter your name" />

            <label>Enter your Aadhaar Number:</label>
            <input type="text" id="aadhaar" placeholder="Enter 12-digit Aadhaar" maxlength="12"
                oninput="this.value = this.value.replace(/[^0-9]/g, '')" />

            <label>Enter your Date of Birth:</label>
            <input type="date" id="dob" />

            <button type="button" id="verifyBtn" onclick="func1()">Verify</button>

            <div id="moreDetails">
                <label>Enter your Phone Number:</label>
                <input type="text" id="phone" value="+91 " maxlength="14"
                    oninput="if(!this.value.startsWith('+91 ')) this.value='+91 '; this.value = '+91 ' + this.value.substring(4).replace(/[^0-9]/g, '')" />

                <label>Enter your Email (optional):</label>
                <input type="email" id="email" placeholder="example@domain.com" />

                <div class="two-col">
                    <div>
                        <label>Gender</label>
                        <select id="gender">
                            <option value="">Select</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div>
                        <label>Pincode</label>
                        <input type="text" id="pincode" maxlength="6"
                            oninput="this.value=this.value.replace(/[^0-9]/g,'')" />
                    </div>
                </div>

                <label>Enter Father's/Spouse Name (optional):</label>
                <input type="text" id="parentName" placeholder="Father's or Spouse's name" />

                <label>Enter Address (optional):</label>
                <input type="text" id="address" placeholder="House no, Street, Locality" />

                <button type="button" id="continueBtn" onclick="funcContinue()">Continue to Vote</button>
            </div>

            <div id="voteSection">
                <label>Enter your Voter's ID</label>
                <input type="text" id="vid" placeholder="Enter 10-char Voter ID" maxlength="10"
                    oninput="this.value = this.value.toUpperCase()" />

                <label>Select your Prefered Party:</label>
                <select id="partySelect">
                    <option value="Select">Select Party</option>
                    <option value="A">Party A</option>
                    <option value="B">Party B</option>
                    <option value="C">Party C</option>
                </select>
                <button type="button" id="submitBtn" onclick="func2()">Submit Vote</button>
            </div>
        </div>
    </form>
    <script>
        function validateEmail(email) {
            var re = /^\S+@\S+\.\S+$/;
            return re.test(email);
        }

        function func1() {
            var name = document.getElementById("name").value.trim();
            if (!name) { alert("Please enter your name"); return; }

            var aadhaar = document.getElementById("aadhaar").value;
            var aadhaarRegex = /^\d{12}$/;
            if (!aadhaarRegex.test(aadhaar)) {
                alert("Invalid Aadhaar Number. Please enter exactly 12 digits.");
                return;
            }

            var dobInput = document.getElementById("dob").value;
            if (!dobInput) { alert("Please enter Date of Birth"); return; }
            var dob = new Date(dobInput);
            var today = new Date();
            var age = today.getFullYear() - dob.getFullYear();
            var m = today.getMonth() - dob.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < dob.getDate())) { age--; }

            if (age < 18) { alert("Not Eligible. Age: " + age); return; }

            alert("Basic verification successful. Please provide additional details to continue.");
            document.getElementById("moreDetails").style.display = "block";
            document.getElementById("verifyBtn").style.display = "none";
        }

        function funcContinue() {
            var phone = document.getElementById("phone").value;
            var phoneRegex = /^\+91 [6-9]\d{9}$/;
            if (!phoneRegex.test(phone)) {
                alert("Invalid Phone Number. Use '+91 XXXXXXXXXX' and first digit must be 6-9.");
                return;
            }

            var email = document.getElementById("email").value.trim();
            if (email && !validateEmail(email)) {
                alert("Invalid email address.");
                return;
            }

            var pincode = document.getElementById("pincode").value;
            if (pincode && pincode.length !== 6) { alert("Invalid Pincode. Must be 6 digits."); return; }

            document.getElementById("voteSection").style.display = "block";
            document.getElementById("moreDetails").style.display = "none";
            alert("Details saved. You can now cast your vote.");
        }

        function func2() {
            var vid = document.getElementById("vid").value.trim();
            if (vid && vid.length !== 10) { alert("Invalid Voter ID. It must be exactly 10 characters long if provided."); return; }

            var select = document.getElementById("partySelect");
            if (select.value === "Select") { alert("Please select a party first!"); return; }

            alert("Vote Submitted successfully for " + select.value);
            document.forms[0].submit();
        }
    </script>
</body>

</html>
